# ---------------------------------------------------------------- official

- id: official-crz-entries-phase1-projection
  statement: The $9 Phase 1 toll reduces daily vehicles entering the Manhattan CBD by 13.4% relative to No Action.
  origin: official
  author: agency
  recorded: 2024-11-01
  recorded_note: Reevaluation 2 is dated November 2024 with no day given; the first of the month is used.
  approved_by: owner
  approved_on: 2026-11-11
  window: {start: 2025-01-05, end: 2026-01-04}
  measurable: false
  not_measurable_reason: >-
    The public entries data begins at launch, and No Action is a modeled counterfactual
    for a 2023 analysis year, so no series this project observes shares the projection's
    baseline. The MTA's own headline counts also add excluded roadways to zone entries.
  rationale: Recorded as the program's stated expectation, to set beside the derived and reproduction entries.
  sources:
    - https://www.mta.info/document/158191
  reported_outcome:
    value: -11
    unit: percent
    note: 27 million fewer vehicles entering the zone in year one. The release does not name its baseline.
    source: https://www.governor.ny.gov/news/less-traffic-better-transit-its-first-anniversary-governor-hochul-celebrates-transformational

# ---------------------------------------------------------------- prospective

- id: prospective-crz-entries-2026-11-08-week
  statement: In the week of November 8 to 14, 2026, about 4% fewer vehicles will enter the Congestion Relief Zone than in the matching week of 2025.
  origin: prospective
  author: ai_sme
  elicited_in: docs/elicitation/2026-11-11-crz-expectations.md
  recorded: 2026-11-11
  approved_by: owner
  approved_on: 2026-11-11
  metric: crz_entries
  comparison: change_vs_period
  window: {start: 2026-11-08, end: 2026-11-14}
  comparison_window: {start: 2025-11-09, end: 2025-11-15}
  expected: {low: -7.5, high: -1.0, unit: percent}
  confidence: 80
  drivers: [vehicle_class, detection_group, time_period]
  rationale: >-
    The year-two gap was -3.0% from March to mid-October 2026 and widened to about -5% in
    September as gas prices peaked. Gas has eased but is still well above a year earlier,
    so the center is -4.3%. Veterans Day falls on a Tuesday in 2025 and a Wednesday in 2026;
    a Tuesday holiday encourages a Monday off, lowering the 2025 week and adding about 0.3 to
    0.5 points. Weekly noise of about 2 points and trend uncertainty set the width. Below the
    range would suggest a storm or a counting outage; above it, a sharp fall in gas prices.
  note: >-
    November 8 to 10 had passed when this was recorded, but the MTA had not published them,
    and the expert used no information from those days.
  sources:
    - https://www.recordinglaw.com/data-stories/nyc-congestion-pricing-traffic-data/
    - https://www.mta.info/document/195631
    - https://www.fingerlakes1.com/2026/10/02/new-york-gas-averages-4-48-as-national-prices-ease-after-record-september/

- id: prospective-yellow-trips-2026-10
  statement: Yellow taxis will make about 5% fewer trips in October 2026 than in October 2025.
  origin: prospective
  author: ai_sme
  elicited_in: docs/elicitation/2026-11-11-crz-expectations.md
  recorded: 2026-11-11
  approved_by: owner
  approved_on: 2026-11-11
  metric: tlc_trips
  filters: {service: yellow}
  comparison: change_vs_period
  window: {start: 2026-10-01, end: 2026-10-31}
  comparison_window: {start: 2025-10-02, end: 2025-11-01}
  expected: {low: -11.0, high: 1.0, unit: percent}
  confidence: 80
  drivers: [zone_relation, pickup_hour]
  rationale: >-
    Yellow growth accelerated through 2025 (about +10% in January, +20% in August), so October
    2025 is a high base, reconstructed at about 4.5 to 4.6 million trips. January to August
    2026 averaged 3.71 million a month; a typical October lift of about 1.16 times gives about
    4.3 to 4.4 million. Pressure down comes from an unlicensed low-price competitor, fuel costs
    for drivers, and the 2025 dispatch gains having been absorbed. The range is wide because no
    monthly 2025 baseline was available to the expert.
  sources:
    - https://automarketplace.substack.com/p/nyc-tlc-market-update-yellow-cab
    - https://www.nyc.gov/assets/tlc/downloads/pdf/testimony_preliminary_budget_3_17_26.pdf

- id: prospective-fhvhv-trips-2026-10
  statement: Uber and Lyft together will make about 3 to 4% more trips in October 2026 than in October 2025.
  origin: prospective
  author: ai_sme
  elicited_in: docs/elicitation/2026-11-11-crz-expectations.md
  recorded: 2026-11-11
  approved_by: owner
  approved_on: 2026-11-11
  metric: tlc_trips
  filters: {service: fhvhv}
  comparison: change_vs_period
  window: {start: 2026-10-01, end: 2026-10-31}
  comparison_window: {start: 2025-10-02, end: 2025-11-01}
  expected: {low: -0.5, high: 7.0, unit: percent}
  confidence: 80
  drivers: [operator_code, zone_relation]
  rationale: >-
    Ride-hail grew steadily through 2025. January to August 2026 averaged 21.02 million trips a
    month against an estimated 20.1 million for the same months of 2025, about +4.5% even with
    storm months included. The risks to the downside are riders moving to an unlicensed
    competitor that TLC records don't capture, and fuel surcharges.
  sources:
    - https://www.axios.com/2026/05/20/new-york-rideshare-battle
    - https://automarketplace.substack.com/p/nyc-tlc-market-update-yellow-cab

- id: prospective-fhvhv-per-yellow-2026-10
  statement: The number of ride-hail trips per yellow taxi trip will rise about 9% from October 2025 to October 2026.
  origin: prospective
  author: ai_sme
  elicited_in: docs/elicitation/2026-11-11-crz-expectations.md
  recorded: 2026-11-11
  approved_by: owner
  approved_on: 2026-11-11
  metric: fhvhv_per_yellow
  comparison: change_vs_period
  window: {start: 2026-10-01, end: 2026-10-31}
  comparison_window: {start: 2025-10-02, end: 2025-11-01}
  expected: {low: 2.0, high: 16.5, unit: percent}
  confidence: 80
  rationale: >-
    Implied by the two October trip expectations: ride-hail +3.5% over yellow -5% gives
    1.035 / 0.95, about +9%. Treating their errors as independent gives an 80% band of about
    +2% to +16.5%. The expert chose this form over a level for the ratio because it removes
    its uncertainty about the October 2025 ratio.
  note: Drivers are not broken down for a ratio metric; see the two trip entries for each service.
  sources:
    - https://automarketplace.substack.com/p/nyc-tlc-market-update-yellow-cab

- id: prospective-car-entries-2026-11
  statement: Private cars, pickups and vans entering the zone in November 2026 will be about 7 to 8% below November 2025.
  origin: prospective
  author: ai_sme
  elicited_in: docs/elicitation/2026-11-11-crz-expectations.md
  recorded: 2026-11-11
  approved_by: owner
  approved_on: 2026-11-11
  metric: crz_entries
  filters: {vehicle_class: cars_pickups_vans}
  comparison: change_vs_period
  window: {start: 2026-11-01, end: 2026-11-28}
  comparison_window: {start: 2025-11-02, end: 2025-11-29}
  expected: {low: -11.0, high: -4.0, unit: percent}
  confidence: 80
  drivers: [detection_group, time_period]
  rationale: >-
    Cars were -7.4% for January 5 to October 17, 2026 against 2025, storm months included, and
    about -8 to -9% in September. Gas prices, January's bridge and tunnel toll increase, and the
    $9 toll all push the same way. The windows line up the Marathon, the end of daylight saving
    time, Veterans Day and Thanksgiving in both years. A possible artifact: cars falling while
    taxi and for-hire entries rise could be partly a reclassification between classes.
  sources:
    - https://www.recordinglaw.com/data-stories/nyc-congestion-pricing-traffic-data/
