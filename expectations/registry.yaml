- id: prospective-taxi-fhv-entries-2026-11
  statement: Taxis and for-hire vehicles entering the zone in November 2026 will be roughly flat to slightly up on November 2025.
  origin: prospective
  author: ai_sme
  elicited_in: docs/elicitation/2026-11-11-crz-expectations.md
  recorded: 2026-11-11
  approved_by: owner
  approved_on: 2026-11-11
  metric: crz_entries
  filters: {vehicle_class: tlc_taxi_fhv}
  comparison: change_vs_period
  window: {start: 2026-11-01, end: 2026-11-28}
  comparison_window: {start: 2025-11-02, end: 2025-11-29}
  expected: {low: -2.0, high: 5.0, unit: percent}
  confidence: 80
  drivers: [detection_group, time_period]
  rationale: >-
    The year-to-date change was +1.6%: ride-hail growth roughly offsets yellow decline. High gas
    prices both push some travelers to ride-hail and squeeze drivers. A result above +5% while
    private cars land below -11% would point to the class-reclassification artifact.
  sources:
    - https://www.recordinglaw.com/data-stories/nyc-congestion-pricing-traffic-data/
    - https://www.mta.info/document/195631

- id: prospective-crz-entries-2026-11-15-week-normal
  statement: The week of November 15 to 21, 2026 will look like a normal week, with 3 to 6 of its 7 days of zone entries inside their usual range.
  origin: prospective
  author: ai_sme
  elicited_in: docs/elicitation/2026-11-11-crz-expectations.md
  recorded: 2026-11-11
  approved_by: owner
  approved_on: 2026-11-11
  metric: crz_entries
  comparison: within_baseline
  window: {start: 2026-11-15, end: 2026-11-21}
  expected: {low: 42.8, high: 85.8, unit: percent_of_days}
  confidence: 80
  drivers: [vehicle_class]
  rationale: >-
    With holidays excluded, each weekday's baseline has 7 or 8 values, and a 10th to 90th
    percentile band from linear interpolation holds only about 61% of ordinary days. A binomial
    then gives 3 to 6 days inside about 88% of the time; correlated weather and seasonal drift
    lower that to about 80%. The bounds sit just outside 3/7 and 6/7 so rounding cannot decide a
    boundary case. No day in the window is a holiday.
  note: Assumes baselines use Spark's exact percentile (linear interpolation), as the spec requires. Day of week was requested as a driver but is not a dimension.

# ---------------------------------------------------------------- derived

- id: derived-cbd-touch-trips-first-year
  statement: If the official forecast's logic held, taxi and ride-hail trips to or from the zone in tolling's first year would be roughly flat against the year before.
  origin: derived
  author: ai_sme
  elicited_in: docs/elicitation/2026-11-11-crz-expectations.md
  recorded: 2026-11-11
  approved_by: owner
  approved_on: 2026-11-11
  metric: tlc_cbd_touch_trips
  comparison: change_vs_period
  window: {start: 2025-01-05, end: 2026-01-03}
  comparison_window: {start: 2024-01-07, end: 2025-01-04}
  expected: {low: -2.5, high: 4.0, unit: percent}
  confidence: 80
  drivers: [service, zone_relation]
  rationale: >-
    The 13.4% projection covers all vehicles, and the cut was expected mostly from private cars.
    Taxis and ride-hail pay per-trip charges ($0.75 and $1.50), roughly a 3 to 5% fare increase;
    fare elasticities of -0.3 to -0.7 give about -1% to -3.5%, partly offset by some drivers
    switching to taxis and by faster trips, so the toll's net effect is about -1.5% against an
    underlying trend of +1% to +4%. This is the expert's translation of the projection, built
    from elasticities, not a figure from Reevaluation 2.
  note: >-
    This window's data was loaded and largely published when this was recorded, so a hit says
    nothing about forecasting skill. Score it as a test of the projection's logic. The expert's
    own estimate, given published data, is +0.5% to +3.0%. Not counted toward calibration.
  sources:
    - https://www.mta.info/document/158191
    - https://www.mta.info/document/195631

# ---------------------------------------------------------------- retrospective

- id: retrospective-fhvhv-per-yellow-first-year
  statement: In tolling's first year there were about 5 ride-hail trips for every yellow taxi trip, down from 5.8 in 2024, because yellow trips surged.
  origin: retrospective
  author: ai_sme
  elicited_in: docs/elicitation/2026-11-11-crz-expectations.md
  recorded: 2026-11-11
  approved_by: owner
  approved_on: 2026-11-11
  metric: fhvhv_per_yellow
  comparison: value_range
  window: {start: 2025-01-05, end: 2026-01-03}
  expected: {low: 4.93, high: 5.07, unit: ratio}
  confidence: 95
  rationale: >-
    Calendar 2025 gives 243.6 million over 48.7 million, 5.00. The fall came from yellow supply
    returning and from app dispatch, not from ride-hail weakness. Moving the window from the
    calendar year swaps four pre-toll days for three 2026 days, which is negligible.
  note: A consistency check with no evidential weight, because the value was known when recorded.
  sources:
    - https://automarketplace.substack.com/p/nyc-tlc-market-update-yellow-cab

- id: retrospective-reproduce-mta-table-3-2-total
  statement: The pipeline reproduces the MTA's figure that yellow and ride-hail trips starting or ending in the zone rose about 0.8% from January to September 2024 to the same months of 2025.
  origin: retrospective
  author: ai_sme
  elicited_in: docs/elicitation/2026-11-11-crz-expectations.md
  recorded: 2026-11-11
  approved_by: owner
  approved_on: 2026-11-11
  metric: tlc_cbd_touch_trips
  comparison: change_vs_period
  window: {start: 2025-01-01, end: 2025-09-30}
  comparison_window: {start: 2024-01-01, end: 2024-09-30}
  expected: {low: 0.3, high: 1.4, unit: percent}
  confidence: 85
  drivers: [service, zone_relation]
  rationale: >-
    Target +0.82% in totals: 309,603 x 273 / (305,961 x 274) - 1, from Table 3-2's average daily
    trips for yellow and ride-hail only (the published total of +1.4% also includes green taxis
    and other for-hire vehicles, which the pipeline does not load). The tolerance of about 0.5
    points covers zones mapped differently, record cleaning, file revisions, and whether the
    MTA's January starts on the 1st or the 5th. A larger miss points to the pipeline, not traffic.
  note: >-
    Reproduces a published figure to validate the pipeline; not a forecast. If the yellow and
    ride-hail reproductions pass but this misses, check what the unfiltered metric includes.
  sources:
    - https://www.mta.info/document/195631

