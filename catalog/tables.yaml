# Plain-language descriptions of every warehouse table and column.
#
# `make catalog-comments` writes these into Iceberg as table and column comments.
# `make catalog-export` reads the comments back and writes catalog/schema.md and
# catalog/index.md, which are what a model is shown.
#
# Per table:
#   summary   one line, used as the table's line in the index. It has to carry the
#             look-alike decision on its own (which table to use instead, and when).
#   grain     what one row is.
#   details   optional: coverage, quirks, how to read it.
#   not_for   when NOT to use the table, and what to use instead.
#   columns   name -> description, or name -> {description, owner_review}.
#
# `owner_review` marks a meaning that could not be established from the code, the spec,
# docs/sources.md or the decision records. The description then says only what is known.
# It is not written to the warehouse. None is open now: the owner's review of 2026-11-12
# settled the three that were (the fee, excluded roadways, and the time period).
#
# Facts come from docs/SPEC.md section 6, docs/sources.md, decisions 0004, 0005, 0008 to
# 0012, the code that builds each table, queries on the warehouse on 2026-11-12, and the
# owner's review of that date against the MTA's column descriptions and the bronze files.
# Row counts and date ranges are as of that date. Tables that grow on every run
# (checks.*, expectations.*) carry no row counts.

tables:
  silver.trips:
    summary: >-
      Every yellow taxi and ride-hail (Uber, Lyft) trip, one row per trip, about 1.07
      billion rows. Use only when a question needs single trips, exact times, dropoff,
      zones, miles or the fee amount. For counts per day use gold.daily_trips or
      gold.daily_trip_slices.
    grain: one trip.
    details: >-
      Pickups from 2023-01-01 to 2026-09-30. Partitioned by service and by month of
      pickup_at, so always filter on service and on a pickup_at range (on the raw column,
      not on an expression of it). Times are New York wall-clock time with no time zone.
      Congestion tolling began on 2025-01-05 at 00:00. A reversed trip is kept as two
      rows, the original and its reversal (see cbd_congestion_fee), so row counts
      include both: about 1.2% of yellow rows in June 2025.
    not_for: >-
      daily, monthly or yearly trip counts (gold.daily_trips), or counts by operator,
      hour, or whether the trip touched the toll zone (gold.daily_trip_slices). A query
      without a pickup_at filter scans a billion rows.
    columns:
      service: "'yellow' for yellow taxis, 'fhvhv' for high-volume for-hire vehicles (ride-hail: Uber and Lyft)."
      operator_code: "Ride-hail company, as the TLC licence number: 'HV0003' is Uber, 'HV0005' is Lyft. Null for yellow taxis."
      pickup_at: "When the trip started, New York wall-clock time. Each row's pickup falls inside its source_month."
      dropoff_at: "When the trip ended, New York wall-clock time. It can fall on the day or month after pickup_at. A few rows have a dropoff before the pickup, and some hold junk dates (the earliest is 1970-01-20)."
      pickup_zone_id: "TLC taxi zone where the trip started. Joins to reference.cbd_zones.location_id. 264 is unknown and 265 is outside New York City."
      dropoff_zone_id: "TLC taxi zone where the trip ended. Joins to reference.cbd_zones.location_id. 264 is unknown and 265 is outside New York City."
      trip_miles: "Trip distance in miles, as the source reports it. Some trips record zero, and some hold impossible values (the largest is 398,608.62)."
      cbd_congestion_fee: >-
        Congestion fee recorded on the trip, in dollars. Null for every trip before
        2025-01, when the source had no such column, and filled for every trip from
        2025-01. Zero means recorded as no fee. The usual values are the MTA's per-trip
        charge: 0.75 for yellow taxis and 1.5 for ride-hail. Rare other values exist
        (3.0, 1.25, up to 4.5). A negative value such as -0.75 marks a reversal record:
        a second row that cancels an earlier trip row, which usually is also present
        with a positive fee. That reading comes from the June 2025 yellow source file,
        not from TLC's data dictionary. A 'fee trip' is one where this is greater than 0.
      source_month: "Month of the source file the row came from, as 'YYYY-MM'. Equal to the month of pickup_at."

  silver.crz_entries:
    summary: >-
      Vehicle entries into the Congestion Relief Zone from the MTA, one row per
      10-minute block, vehicle class and crossing point, about 6.9 million rows from
      2025-01-05. Use only for questions finer than a day (hours, 10-minute blocks) or
      about detection_region. For daily totals use gold.daily_entries.
    grain: one 10-minute block x vehicle class x detection group (one source row).
    details: >-
      2025-01-05 to 2026-10-31. Partitioned by month of interval_start, so filter on an
      interval_start range. A normal day has 10,368 rows (144 blocks x 6 classes x 12
      groups). On the day daylight saving ends (2025-11-02) each block from 1:00 to 1:50
      appears twice with the same keys, and both rows are real, so sum them. On the day
      it starts an hour is missing. There is no data before tolling began.
    not_for: >-
      entries per day, week, month or year (gold.daily_entries has the same numbers
      already added up). Not for taxi or ride-hail trips (those are in the trips tables),
      and the MTA says not for estimating toll revenue.
    columns:
      toll_date: "Date of the 10-minute block."
      interval_start: "Start of the 10-minute block, New York wall-clock time."
      time_period: "'Peak' or 'Overnight': whether the block's hour would receive peak or overnight tolls. Peak is 5 AM to 9 PM on weekdays and 9 AM to 9 PM on weekends. The MTA calls this the current schedule, so it could change."
      vehicle_class: "One of cars_pickups_vans, single_unit_trucks, multi_unit_trucks, buses, motorcycles, tlc_taxi_fhv. tlc_taxi_fhv is taxis and for-hire vehicles in the per-trip charge plan; those outside the plan are counted in the other classes."
      detection_group: "Crossing point where the vehicle was first detected entering the zone. 12 values, such as 'Lincoln Tunnel', 'Brooklyn Bridge', 'East 60th St'."
      detection_region: "Wider area the detection group belongs to. 7 values: Brooklyn, Queens, New Jersey, East 60th St, West 60th St, FDR Drive, West Side Highway."
      crz_entries: "Number of vehicles detected entering the Congestion Relief Zone in the block. It leaves out vehicles that stayed on excluded roadways, which are counted in excluded_roadway_entries. The two never overlap, and their sum is all entries into the Central Business District."
      excluded_roadway_entries: "Number of vehicles that entered the Central Business District but stayed on excluded roadways: the FDR Drive, the West Side Highway/West Street, or the Hugh L. Carey Tunnel connections to West Street. These vehicles are not charged and are not in crz_entries. Non-zero only at four crossings: FDR Drive at 60th St, West Side Highway at 60th St, Brooklyn Bridge and Hugh L. Carey Tunnel."
      source_pull_date: "Date the source file this row was built from was downloaded."

  gold.daily_trips:
    summary: >-
      Daily count of taxi and ride-hail trips, one row per pickup date and service
      (yellow or fhvhv). The first choice for trips per day, month or year by service.
      It has no operator, hour or zone; for those use gold.daily_trip_slices.
    grain: one pickup date x service.
    details: >-
      2023-01-01 to 2026-09-30, 2,738 rows. Built from silver.trips. Its totals equal
      gold.daily_trip_slices for every day and service.
    not_for: >-
      breakdowns by Uber or Lyft, pickup hour, or whether the trip touched the toll zone
      (gold.daily_trip_slices), or anything about a single trip (silver.trips). Not for
      vehicles entering the zone (gold.daily_entries).
    columns:
      trip_date: "Date the trips were picked up, New York time."
      service: "'yellow' for yellow taxis, 'fhvhv' for ride-hail (Uber and Lyft)."
      trips: "Number of trips picked up that day. It counts every row of silver.trips, so a reversed trip counts twice (see silver.trips.cbd_congestion_fee)."
      cbd_fee_trips: "Number of those trips with a congestion fee greater than 0. Always 0 before 2025, when no fee was recorded. The same count is called fee_trips in gold.daily_trip_slices."

  gold.daily_trip_slices:
    summary: >-
      Daily count of taxi and ride-hail trips broken down by service, operator (Uber or
      Lyft), pickup hour, and whether the trip started or ended inside the toll zone.
      Use for those breakdowns; for plain totals by service gold.daily_trips is smaller.
    grain: one pickup date x service x operator x zone relation x pickup hour.
    details: >-
      2023-01-01 to 2026-09-30, 394,240 rows. Built from silver.trips and
      reference.cbd_zones. Add up trips over the rows you need. Zones are judged by
      pickup and dropoff only: a trip that just passes through the toll zone is in
      'neither', and classification is approximate at the 60th Street edge.
    not_for: >-
      single trips, trip miles, dropoff times, fee amounts or individual zones
      (silver.trips). Not for vehicles entering the zone (gold.daily_entries).
    columns:
      trip_date: "Date the trips were picked up, New York time."
      service: "'yellow' for yellow taxis, 'fhvhv' for ride-hail (Uber and Lyft)."
      operator_code: "Ride-hail company: 'HV0003' is Uber, 'HV0005' is Lyft. Null for yellow taxis."
      zone_relation: "Which ends of the trip are inside the congestion toll zone: 'both_in', 'pickup_in' (only the pickup), 'dropoff_in' (only the dropoff), or 'neither'. A trip touches the zone when this is not 'neither'."
      pickup_hour: "Hour of the day the trips were picked up, 0 to 23, New York time."
      trips: "Number of trips in this slice. It counts every row of silver.trips, so a reversed trip counts twice (see silver.trips.cbd_congestion_fee)."
      fee_trips: "Number of those trips with a congestion fee greater than 0. Always 0 before 2025. The same count is called cbd_fee_trips in gold.daily_trips."

  gold.daily_entries:
    summary: >-
      Daily count of vehicles entering the Congestion Relief Zone, one row per date,
      vehicle class, crossing point and time period, from 2025-01-05. The first choice
      for entries per day, week, month or year. For hours or 10-minute blocks use
      silver.crz_entries.
    grain: one date x vehicle class x detection group x time period.
    details: >-
      2025-01-05 to 2026-10-31, 95,760 rows. Built from silver.crz_entries. Add up
      crz_entries over the rows you need. There is no data before tolling began, so it
      cannot show a before-and-after comparison.
    not_for: >-
      anything within a day (silver.crz_entries), detection_region (silver.crz_entries),
      taxi or ride-hail trips (gold.daily_trips), or what a normal day looks like
      (gold.baselines).
    columns:
      entry_date: "Date of the entries."
      vehicle_class: "One of cars_pickups_vans, single_unit_trucks, multi_unit_trucks, buses, motorcycles, tlc_taxi_fhv. tlc_taxi_fhv is taxis and for-hire vehicles in the per-trip charge plan; those outside the plan are counted in the other classes."
      detection_group: "Crossing point where the vehicle was first detected entering the zone. 12 values, such as 'Lincoln Tunnel', 'Brooklyn Bridge', 'East 60th St'."
      time_period: "'Peak' or 'Overnight': whether the hour would receive peak or overnight tolls. Peak is 5 AM to 9 PM on weekdays and 9 AM to 9 PM on weekends. The MTA calls this the current schedule, so it could change."
      crz_entries: "Number of vehicles detected entering the Congestion Relief Zone. It leaves out vehicles that stayed on excluded roadways, which are counted in excluded_roadway_entries. The two never overlap, and their sum is all entries into the Central Business District."
      excluded_roadway_entries: "Number of vehicles that entered the Central Business District but stayed on excluded roadways: the FDR Drive, the West Side Highway/West Street, or the Hugh L. Carey Tunnel connections to West Street. These vehicles are not charged and are not in crz_entries. Non-zero only at four crossings: FDR Drive at 60th St, West Side Highway at 60th St, Brooklyn Bridge and Hugh L. Carey Tunnel."

  gold.baselines:
    summary: >-
      What a normal day looks like for a metric: the 10th, 50th and 90th percentile of
      the same weekday over the previous 8 weeks, one row per metric, slice and date.
      Use to judge whether a day was unusual. It does not hold what actually happened;
      get that from gold.daily_entries or gold.daily_trip_slices.
    grain: one metric x slice x date.
    details: >-
      Metrics: 'crz_entries' (daily sum of gold.daily_entries.crz_entries, from
      2025-02-16), 'tlc_trips' (daily sum of gold.daily_trip_slices.trips) and
      'tlc_cbd_touch_trips' (the same where zone_relation is not 'neither'), both from
      2023-02-14. For the whole metric filter slice_key = 'all'. Other rows are one value
      of one dimension, never a combination. The history of a date is the 8 dates exactly
      7, 14, ... 56 days earlier, with public holidays left out. A date with fewer than
      6 usable values has no row. Partitioned by metric and month of baseline_date.
    not_for: >-
      observed counts of trips or entries (the gold daily tables), or expected values
      that people wrote down (expectations.verdicts).
    columns:
      metric: "Which metric the row describes: 'crz_entries', 'tlc_trips' or 'tlc_cbd_touch_trips'."
      slice_key: "'all' for the whole metric, or the name of the dimension the row is sliced by: service, operator_code, zone_relation, pickup_hour, vehicle_class, detection_group or time_period."
      slice_value: "'all' when slice_key is 'all', otherwise the dimension's value as text, such as 'yellow' or 'Lincoln Tunnel'."
      baseline_date: "The date this normal range is for."
      method: "How the range was computed. Always 'same_weekday_trailing_8'."
      p10: "10th percentile of the metric's daily value over the history. The low end of the normal band."
      p50: "Median of the metric's daily value over the history."
      p90: "90th percentile of the metric's daily value over the history. The high end of the normal band."
      n_obs: "Number of earlier days the percentiles rest on, 6 to 8."

  checks.results:
    summary: >-
      Results of the pipeline's data quality checks (pass, warn or fail), one row each
      time a check ran on a table and partition. Use for the health of the data. It is
      append-only, so take the newest row per check, target and partition for the
      current state.
    grain: one check execution (check x target x partition x run).
    details: >-
      A check and partition appear once per run, so the same check has
      several rows over time. The current result is the row with the latest checked_at
      for each check_id, target_table and partition_value.
    not_for: >-
      row counts of the loads themselves (checks.ingest_stats), or whether an
      expectation about the world held (expectations.verdicts).
    columns:
      run_id: "Identifier of the checks run that produced the row."
      checked_at: "When the check ran (UTC)."
      check_id: "Name of the check, such as 'required_nulls', 'silver_volume', 'fee_presence', 'freshness', 'regression_totals', 'entries_days_complete', 'cbd_zone_membership'."
      target_table: "What was checked: a warehouse table such as 'silver.trips', or a source such as 'bronze/yellow', 'bronze/fhvhv' or 'bronze/crz_entries'."
      partition_value: "Which part was checked: 'service/YYYY-MM' such as 'yellow/2025-01', 'service/YYYY', a month 'YYYY-MM', a year, a source name, or 'all'."
      status: "'pass', 'warn' or 'fail'."
      observed: "The number the check measured. Its meaning depends on the check (a share, a count, a ratio); message says which. Can be null."
      threshold: "The rule the observed number was held to, as text."
      message: "A sentence saying what was found."

  checks.ingest_stats:
    summary: >-
      Rows read from each source file and rows kept, one row each time a month of a
      source was loaded into silver. Use for how many rows a load read, kept or dropped.
      It is append-only: take the newest row per service and month.
    grain: one silver load (service x source month x load).
    details: >-
      A month loaded more than once has several rows; the latest loaded_at is
      the current one. Rows dropped are rows_read minus rows_kept: rows whose date was
      outside the file's month.
    not_for: >-
      counting trips or entries (the gold tables), or check outcomes (checks.results).
    columns:
      run_id: "Identifier of the load that wrote the row."
      loaded_at: "When the load finished (UTC)."
      service: "Which source was loaded: 'yellow', 'fhvhv', or 'crz_entries' for the MTA entries data."
      source_month: "Month that was loaded, as 'YYYY-MM'."
      rows_read: "Rows in the source file."
      rows_kept: "Rows written to silver: those inside the month."

  expectations.verdicts:
    summary: >-
      The outcome of scoring each written-down expectation (held, violated, pending and
      so on) with the observed value and expected range, one row per expectation per
      scoring run. Append-only: use the run with the latest scored_at for the current
      state.
    grain: one expectation x scoring run.
    details: >-
      Every run scores every expectation. The expectation's sentence and reasoning
      are not in the warehouse; they are in expectations/registry.yaml, keyed by
      expectation_id.
    not_for: >-
      where a gap comes from (expectations.drivers), data quality (checks.results), or
      the statistical normal range (gold.baselines).
    columns:
      run_id: "Identifier of the scoring run. Joins to expectations.drivers.run_id."
      scored_at: "When the run scored the expectations (UTC). The latest value marks the current run."
      registry_commit: "Git commit of the expectation registry the run used, with '-dirty' added if there were uncommitted changes. Changes under the generated site/ folder do not count."
      expectation_id: "Identifier of the expectation, such as 'derived-cbd-touch-trips-first-year'."
      window_start: "First date of the period the expectation is about."
      window_end: "Last date of the period the expectation is about, inclusive."
      observed: "What was measured, in the unit given by unit. Null when the verdict is 'pending' or 'not_scoreable', and for a 'data_issue' whose period has no data."
      expected_low: "Low end of the expected range, in the same unit. Null for 'not_scoreable'."
      expected_high: "High end of the expected range, in the same unit. Null for 'not_scoreable'."
      unit: "'percent' (change against a comparison period), 'percent_of_days' (share of days inside the baseline band) or 'ratio'. Null for 'not_scoreable'."
      verdict: "'held' (observed is inside the range), 'violated_low', 'violated_high', 'pending' (the period's data is not loaded yet), 'data_issue' (a data check failed on the inputs) or 'not_scoreable'."
      failing_checks: "List of check ids that caused a 'data_issue' verdict. Empty otherwise."
      note: "Free text: why an entry is not scoreable, how far data is loaded for a pending one, or days left out."

  expectations.drivers:
    summary: >-
      For scored expectations, how much each slice (a service, an operator, a zone
      relation) contributes to the gap between observed and expected, one row per
      expectation, dimension and slice per scoring run. It has no timestamp: join to
      expectations.verdicts on run_id to find the latest run.
    grain: one scoring run x expectation x dimension x slice.
    details: >-
      Only expectations that compare a period with an earlier one and were
      held or violated have rows. Every slice is assumed to move by the midpoint of the
      expected range, so the gaps of one dimension add up to the total gap. Values are
      totals over the whole period, in the unit of the expectation's metric: trips for
      a trips metric, vehicle entries for an entries metric. A driver says where a
      gap comes from, not why.
    not_for: >-
      the verdict itself or the expected range (expectations.verdicts), or daily counts
      (the gold tables).
    columns:
      run_id: "Identifier of the scoring run. Joins to expectations.verdicts.run_id."
      expectation_id: "Identifier of the expectation."
      dimension: "The dimension the gap is broken down by, from the ones the expectation lists. So far 'service', 'operator_code' and 'zone_relation'; expectations still pending will add 'pickup_hour', 'vehicle_class', 'detection_group' and 'time_period'."
      slice_value: "One value of that dimension, such as 'yellow', 'HV0003' or 'pickup_in'. '(none)' stands for no value."
      comparison_value: "The slice's total over the earlier comparison period."
      observed_value: "The slice's total over the expectation's period."
      expected_value: "What the slice would be if it had moved by the midpoint of the expected range: comparison_value x (1 + midpoint)."
      gap: "observed_value minus expected_value."
      share_of_gap: "The slice's gap divided by the total gap of the dimension, as a fraction (1.0 is 100%). Can be far above 1 or negative when the total gap is small. Null only when the total gap is exactly 0."
      gap_rank: "1 for the slice with the largest gap in absolute size, then 2, and so on, within the run, expectation and dimension."

  reference.cbd_zones:
    summary: >-
      The 265 TLC taxi zones with name, borough, and whether each lies inside the
      congestion toll zone (38 do). Use to name a zone id from silver.trips or to list
      zones. Daily counts by inside or outside the zone are already in
      gold.daily_trip_slices.
    grain: one TLC taxi zone.
    details: >-
      265 rows. Zone names and boroughs come from the TLC lookup; membership comes from
      the MTA's list of zones in the Central Business District (CBD), which is the
      Congestion Relief Zone. Rebuilt in full on each load.
    not_for: >-
      counting trips or entries (it holds no counts), or the MTA's crossing points
      (detection_group in the entries tables is a different thing from a taxi zone).
    columns:
      location_id: "TLC taxi zone id, 1 to 265. Joins to pickup_zone_id and dropoff_zone_id in silver.trips."
      zone: "Name of the zone, such as 'Midtown Center'. Id 264 is 'N/A' and id 265 is 'Outside of NYC'."
      borough: "Borough the zone is in, such as 'Manhattan' or 'Queens'. 'Unknown' for id 264 and 'N/A' for id 265."
      in_cbd: "True when the zone is inside the congestion toll zone."
      membership_source: "Where in_cbd came from. Always 'mta_yfdc-w5jh', the MTA's dataset of zones in the toll zone."
      pulled_on: "Date the membership list was downloaded."

  reference.holidays:
    summary: >-
      US federal and New York State public holidays from 2023 to 2027, one row per date
      with the holiday's name. Use to mark or exclude holidays; join on the date.
    grain: one holiday date.
    details: "77 rows, 2023-01-01 to 2027-12-31, from the `holidays` Python package (US, New York)."
    not_for: >-
      counts of any kind, or dates that are not holidays (only holidays have rows).
    columns:
      holiday_date: "Date of the holiday."
      name: "Name of the holiday, such as 'Thanksgiving Day'."
