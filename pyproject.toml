[project]
name = "crz-expectations"
version = "0.1.0"
description = "Expectation-driven pipeline for congestion pricing data"
requires-python = ">=3.12"
dependencies = [
    "pyspark==4.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: runs real jobs against Iceberg in a temporary warehouse (separate pytest process)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
