[project]
name = "crz-expectations"
version = "0.1.0"
description = "Expectation-driven pipeline for congestion pricing data"
requires-python = ">=3.12"
dependencies = [
    "pyspark==4.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]