name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPARK_DRIVER_MEMORY: 2g
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          python-version: "3.12"

      - name: Point Spark at temporary folders
        run: |
          echo "IVY_DIR=$RUNNER_TEMP/ivy" >> "$GITHUB_ENV"
          echo "WAREHOUSE_DIR=$RUNNER_TEMP/warehouse" >> "$GITHUB_ENV"
          echo "SPARK_EVENTS_DIR=$RUNNER_TEMP/spark-events" >> "$GITHUB_ENV"

      - name: Cache the Iceberg runtime (Ivy)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ivy
          key: ivy-${{ hashFiles('src/pipeline/session.py') }}

      - name: Install dependencies
        run: uv sync --locked --no-install-project

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format check
        run: uv run --no-sync ruff format --check .

      - name: Validate the registry and the metric catalog
        run: uv run --no-sync python -m pipeline.registry validate

      - name: Registry is append-only
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          if git show FETCH_HEAD:expectations/registry.yaml > "$RUNNER_TEMP/base_registry.yaml" 2>/dev/null; then
            uv run --no-sync python -m pipeline.registry append-only --base "$RUNNER_TEMP/base_registry.yaml"
          else
            echo "No registry on $BASE_REF yet."
          fi

      - name: Unit tests
        run: uv run --no-sync pytest -q -m "not integration"

      - name: Integration tests
        run: uv run --no-sync pytest -q -m integration
